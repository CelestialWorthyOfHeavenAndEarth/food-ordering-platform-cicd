version: '3.9'

services:
  nginx:
    build: ./docker/nginx
    container_name: feastly_nginx_prod
    ports:
      - "80:80"
    volumes:
      - ./app:/var/www/html:ro
    depends_on:
      - php
    networks:
      - feastly_prod
    restart: always
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  php:
    build: ./docker/php
    container_name: feastly_php_prod
    volumes:
      - ./app:/var/www/html:ro
      - ./logs/php:/var/log/php
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - feastly_prod
    restart: always

  mysql:
    image: mysql:8.0
    container_name: feastly_mysql_prod
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE:      ${DB_NAME}
      MYSQL_USER:          ${DB_USER}
      MYSQL_PASSWORD:      ${DB_PASS}
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations:ro
    # NO port exposure in production
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - feastly_prod
    restart: always

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: feastly_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - feastly_prod
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.3
    container_name: feastly_grafana
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - feastly_prod
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    container_name: feastly_loki
    ports:
      - "3100:3100"
    networks:
      - feastly_prod
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: feastly_promtail
    volumes:
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - feastly_prod
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: feastly_cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    networks:
      - feastly_prod
    restart: unless-stopped

volumes:
  mysql_data_prod:
  prometheus_data:
  grafana_data:

networks:
  feastly_prod:
    driver: bridge
