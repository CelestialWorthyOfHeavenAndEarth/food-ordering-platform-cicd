version: '3.9'

services:
  nginx:
    build: ./docker/nginx
    container_name: feastly_nginx_prod
    ports:
      - "80:80"
    volumes:
      - ./app:/var/www/html:ro
    depends_on:
      - php
    networks:
      - feastly_prod
    restart: always
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  php:
    build: ./docker/php
    container_name: feastly_php_prod
    volumes:
      - ./app:/var/www/html:ro
      - ./logs/php:/var/log/php
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - feastly_prod
    restart: always

  mysql:
    image: mysql:8.0
    container_name: feastly_mysql_prod
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE:      ${DB_NAME}
      MYSQL_USER:          ${DB_USER}
      MYSQL_PASSWORD:      ${DB_PASS}
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    # NO port exposure in production
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - feastly_prod
    restart: always

volumes:
  mysql_data_prod:

networks:
  feastly_prod:
    driver: bridge
